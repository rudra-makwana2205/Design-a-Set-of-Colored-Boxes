<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorLab - CSS Color Showcase</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>ColorLab</h1>
      <p>Exploring CSS Color Formats & Grids</p>
    </header>

    <main class="main-content">
      <div class="color-grid">
        <div class="color-box color1">
          <span class="box-label">Hex (#FF5733)</span>
        </div>
        <div class="color-box color2">
          <span class="box-label">RGB (41, 128, 185)</span>
        </div>
        <div class="color-box color3">
          <span class="box-label">Word (teal)</span>
        </div>
        <div class="color-box color4">
          <span class="box-label">HSL (280, 60%, 55%)</span>
        </div>
        <div class="color-box color5">
          <span class="box-label">Alpha/Gradient</span>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
